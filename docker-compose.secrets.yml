services:
  homelab-nexus:
    image: ${IMAGE:-ghcr.io/mateorzan/homelab-nexus-public:latest}
    container_name: homelab-nexus
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      HOST: 0.0.0.0
      POLL_INTERVAL_MS: 5000
    secrets:
      - beszel_url
      - beszel_user_email
      - beszel_user_password
      - uptimekuma_url
      - uptimekuma_status_page
      - gotify_url
      - gotify_token
    volumes:
      - ./data:/app/data

secrets:
  beszel_url:
    file: ./secrets/beszel_url
  beszel_user_email:
    file: ./secrets/beszel_user_email
  beszel_user_password:
    file: ./secrets/beszel_user_password
  uptimekuma_url:
    file: ./secrets/uptimekuma_url
  uptimekuma_status_page:
    file: ./secrets/uptimekuma_status_page
  gotify_url:
    file: ./secrets/gotify_url
  gotify_token:
    file: ./secrets/gotify_token
